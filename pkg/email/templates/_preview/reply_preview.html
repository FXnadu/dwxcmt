<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>示例站点 有人回复了你的评论</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #efeeeb;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 300;
      font-size: 14px;
      line-height: 1.7;
      color: #24262b;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid rgba(36, 38, 43, 0.1);
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(36, 38, 43, 0.04), 0 2px 8px rgba(36, 38, 43, 0.06);
      overflow: hidden;
    }
    .header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(36, 38, 43, 0.1);
    }
    .title {
      font-size: 18px;
      font-weight: 400;
      color: #24262b;
      margin: 0;
    }
    .body {
      padding: 24px;
    }
    .row {
      margin-bottom: 16px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: rgba(36, 38, 43, 0.62);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .value {
      color: #24262b;
      word-break: break-word;
    }
    .parent-box {
      position: relative;
      background-color: #eae9e6;
      padding: 12px 16px 8px 30px;
      border-radius: 2px;
      overflow: hidden;
    }
    .parent-box .quote-mark {
      position: absolute;
      top: 4px;
      left: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      line-height: 1;
      color: rgba(36, 38, 43, 0.12);
    }
    .parent-box p {
      margin: 0;
      color: rgba(36, 38, 43, 0.75);
      line-height: 1.7;
    }
    .content-box {
      position: relative;
      background-color: #f4f3f0;
      padding: 12px 16px 8px 34px;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .content-box .quote-mark {
      position: absolute;
      top: 4px;
      left: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      line-height: 1;
      color: rgba(36, 38, 43, 0.12);
    }
    .content-box p {
      margin: 0;
      line-height: 1.7;
    }
    .divider {
      height: 1px;
      background: rgba(36, 38, 43, 0.1);
      margin: 20px 0;
    }
    .action {
      margin-top: 20px;
      text-align: center;
    }
    .action-btn {
      display: inline-block;
      color: #24262b;
      text-decoration: none;
      font-size: 13px;
      border-bottom: 1px solid rgba(36, 38, 43, 0.35);
      padding-bottom: 2px;
    }
    .footer {
      padding: 16px 24px;
      color: rgba(36, 38, 43, 0.62);
      font-size: 12px;
      text-align: center;
    }
    @media (max-width: 480px) {
      .header, .body {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <h1 class="title">有人在 示例站点 回复了你</h1>
      </div>
      <div class="body">
        <div class="row">
          <div class="label">你的评论</div>
          <div class="parent-box" style="background-color:#eae9e6;">
            <div class="quote-mark">&ldquo;</div>
            <p>这个方案很不错，想问下部署的时候需要额外配置什么吗？</p>
          </div>
        </div>

        <div class="divider"></div>

        <div class="row">
          <div class="label">回复者</div>
          <div class="value">李四</div>
        </div>

        <div class="row">
          <div class="label">时间</div>
          <div class="value">2026-08-09 15:02</div>
        </div>

        <div class="row">
          <div class="label">回复内容</div>
          <div class="content-box" style="background-color:#f4f3f0;">
            <div class="quote-mark">&ldquo;</div>
            <p>只需要在后台配置 SMTP 和发件邮箱即可，其他开箱即用。</p>
          </div>
        </div>

        <div class="action">
          <a class="action-btn" href="https://example.com/post/eleventy-static-site">前往查看完整评论</a>
        </div>
      </div>
      <div class="footer">
        此邮件由系统自动发送，请勿直接回复。
      </div>
    </div>
  </div>
</body>
</html>
