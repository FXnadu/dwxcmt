<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.SiteName}} 有人回复了你的评论</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #efeeeb;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 300;
      font-size: 14px;
      line-height: 1.7;
      color: #24262b;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid rgba(36, 38, 43, 0.1);
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(36, 38, 43, 0.04), 0 2px 8px rgba(36, 38, 43, 0.06);
      overflow: hidden;
    }
    .header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(36, 38, 43, 0.1);
    }
    .brand {
      font-family: "Space Grotesk", Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #70687a;
      margin: 0;
    }
    .title {
      font-size: 18px;
      font-weight: 400;
      color: #24262b;
      margin: 8px 0 0;
    }
    .body {
      padding: 24px;
    }
    .row {
      margin-bottom: 16px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: rgba(36, 38, 43, 0.62);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .value {
      color: #24262b;
      word-break: break-word;
    }
    .parent-box {
      position: relative;
      background: #eae9e6;
      padding: 12px 16px 8px 30px;
      border-radius: 2px;
      overflow: hidden;
    }
    .parent-box .quote-mark {
      position: absolute;
      top: 4px;
      left: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      line-height: 1;
      color: rgba(36, 38, 43, 0.12);
    }
    .parent-box p {
      margin: 0;
      color: rgba(36, 38, 43, 0.75);
      line-height: 1.7;
    }
    .content-box {
      position: relative;
      background: #f4f3f0;
      padding: 12px 16px 8px 34px;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .content-box .quote-mark {
      position: absolute;
      top: 4px;
      left: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      line-height: 1;
      color: rgba(36, 38, 43, 0.12);
    }
    .content-box p {
      margin: 0;
      line-height: 1.7;
    }
    .divider {
      height: 1px;
      background: rgba(36, 38, 43, 0.1);
      margin: 20px 0;
    }
    .footer {
      padding: 16px 24px;
      color: rgba(36, 38, 43, 0.62);
      font-size: 12px;
      text-align: center;
    }
    @media (max-width: 480px) {
      .header, .body {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <p class="brand">dwx Comment</p>
        <h1 class="title">有人在 {{.SiteName}} 回复了你</h1>
      </div>
      <div class="body">
        <div class="row">
          <div class="label">你的评论</div>
          <div class="parent-box">
            <div class="quote-mark">“</div>
            <p>{{.ParentContent}}</p>
          </div>
        </div>

        <div class="divider"></div>

        <div class="row">
          <div class="label">回复者</div>
          <div class="value">{{.Nick}}</div>
        </div>

        <div class="row">
          <div class="label">时间</div>
          <div class="value">{{.CreateTime}}</div>
        </div>

        <div class="row">
          <div class="label">回复内容</div>
          <div class="content-box">
            <div class="quote-mark">“</div>
            <p>{{.Content}}</p>
          </div>
        </div>
      </div>
      <div class="footer">
        此邮件由 {{.SiteName}} 自动发送，请勿直接回复。
      </div>
    </div>
  </div>
</body>
</html>
